<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Markdown Converted Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2563eb;
            border-bottom: 3px solid #2563eb;
            padding-bottom: 10px;
        }

        h2 {
            color: #7c3aed;
            margin-top: 30px;
        }

        h3 {
            color: #0891b2;
        }

        p {
            line-height: 1.7;
        }

        strong {
            color: #dc2626;
        }

        em {
            color: #059669;
        }

        ul, ol {
            padding-left: 30px;
            line-height: 1.8;
        }

        li {
            margin-bottom: 5px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        code {
            background: #eef2ff;
            color: #7c3aed;
            padding: 4px 7px;
            border-radius: 5px;
            font-family: Consolas, monospace;
        }

        pre {
            background: #1e293b;
            color: white;
            padding: 18px;
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My Profile</h1>
<h2>About Me</h2>
<p>I am learning <strong>Python</strong> and <em>Artificial Intelligence</em>.</p>
<h2>Skills</h2>
<ul>
<li>Python</li>
<li>NumPy</li>
<li>Pandas</li>
<li>Machine Learning</li>
</ul>
<h2>Learning Goals</h2>
<ol>
<li>Learn Python</li>
<li>Learn Machine Learning</li>
<li>Learn Artificial Intelligence</li>
</ol>
<h2>Useful Link</h2>
<p><a href="https://github.com">GitHub</a></p>
<h2>Code Example</h2>
<p><code>print("Hello World")</code></p>
    </div>
</body>
</html>
